name: Deploy ANITRAX Contract to Casper Testnet

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find all Rust files
        run: |
          echo "=== All Cargo.toml files ==="
          find . -name "Cargo.toml"
          echo "=== All lib.rs files ==="
          find . -name "lib.rs"
          echo "=== All build.rs files ==="
          find . -name "build.rs"
          echo "=== Full tree ==="
          find . -not -path './.git/*' | head -50

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-odra
        run: cargo install cargo-odra

      - name: Build WASM
        run: |
          cd anitrax-contract
          cargo build --target wasm32-unknown-unknown --bin anitrax_contract_build_contract --release --features build-contract

      - name: Install casper-client
        run: cargo install casper-client

      - name: Deploy to Casper Testnet
        env:
          SECRET_KEY: ${{ secrets.CASPER_SECRET_KEY }}
        run: |
          echo "$SECRET_KEY" > /tmp/secret_key.pem
          chmod 600 /tmp/secret_key.pem
          casper-client put-deploy \
            --node-address http://65.21.235.219:7777 \
            --chain-name casper-test \
            --secret-key /tmp/secret_key.pem \
            --session-path anitrax-contract/target/wasm32-unknown-unknown/release/anitrax_contract_build_contract.wasm \
            --payment-amount 200000000000 \
            --ttl 30min
