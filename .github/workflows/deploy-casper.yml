name: Deploy Contract to Casper Testnet

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install Casper Client
        run: |
          cargo install casper-client --locked

      - name: Build Smart Contract
        run: |
          cargo build --release --target wasm32-unknown-unknown

      - name: Deploy Contract
        run: |
          echo "${{ secrets.SECRET_KEY }}" > secret_key.pem
          
          casper-client put-transaction \
            --node-address http://95.216.67.162:7777 \
            --chain-name casper-test \
            --secret-key secret_key.pem \
            --payment-amount 50000000000 \
            --session-path target/wasm32-unknown-unknown/release/anitraxgasper.wasm

      - name: Clean up keys
        if: always()
        run: rm -f secret_key.pem
