name: Deploy ANITRAX Contract to Casper Testnet

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-01
          targets: wasm32-unknown-unknown

      - name: Install cargo-odra
        run: cargo install cargo-odra

      - name: Build WASM
        run: |
          cd anitrax-contract
          cargo +nightly-2026-01-01 build --target wasm32-unknown-unknown --bin anitrax_contract_build_contract --release --features build-contract

      - name: Install casper-client
        run: cargo install casper-client

      - name: Check node status
        run: |
          curl -s -X POST https://node.testnet.casper.network/rpc \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"chain_get_block","params":{}}' | head -c 200

      - name: Deploy to Casper Testnet
        env:
          SECRET_KEY: ${{ secrets.CASPER_SECRET_KEY }}
        run: |
          echo "$SECRET_KEY" > /tmp/secret_key.pem
          chmod 600 /tmp/secret_key.pem
          casper-client put-transaction session \
            --node-address https://node.testnet.casper.network \
            --chain-name casper-test \
            --secret-key /tmp/secret_key.pem \
            --wasm-path anitrax-contract/target/wasm32-unknown-unknown/release/anitrax_contract_build_contract.wasm \
            --gas-price-tolerance 3 \
            --payment-amount 200000000000 \
            --ttl 30min
